<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }
  body {
    min-height: 100vh;
    background: radial-gradient(120% 80% at 50% -10%, #17482d 0%, #06170e 60%);
    color: #f2f7f3;
    font-family: 'Hiragino Kaku Gothic ProN','Yu Gothic','Trebuchet MS',system-ui,sans-serif;
    display: flex; justify-content: center;
  }
  #app { width: 100%; max-width: 430px; padding: 20px 18px 40px; }
  button { font-family: inherit; }
  h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: 1px; }
  @keyframes gkDive { from { transform: scale(0.3); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  @keyframes gkSpin { to { transform: rotate(360deg) } }
  @keyframes gkShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(2px)} }
  @keyframes gkIn { from { opacity:0; transform: translateY(12px) scale(.96) } to { opacity:1; transform:none } }
  @keyframes gkFlash { from { transform:scale(.7); opacity:.9 } to { transform:scale(1.7); opacity:0 } }
  @keyframes crowdBounce { 0%,100%{ transform:translateY(0) } 30%{ transform:translateY(-7px) } }
  @keyframes fwBurst { from{ transform:translate(0,0); opacity:1 } to{ transform:translate(var(--dx),var(--dy)); opacity:0 } }
  @keyframes rainFall { from{ transform:translateY(-20vh) } to{ transform:translateY(120vh) } }
</style>

function cr(z){ return { c: z % COLS, r: Math.floor(z / COLS) }; }
function cellDist(a,b){ var A=cr(a),B=cr(b); return Math.hypot(A.c-B.c, A.r-B.r); }
function allZones(){ var a=[]; for(var i=0;i<ZONES;i++) a.push(i); return a; }
function shuffle(a){ var x=a.slice(); for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
// まと（候補ゾーン）を選ぶ。近すぎると見分けがつかないので、
// 左右にしっかり離れた組み合わせを優先する。
function pickCandidates(t, extra){
  if(extra<=0) return [t];
  var chosen=[t], pool=shuffle(allZones()).filter(function(z){ return z!==t; }), i, j;
  function ok(z, minD, minCol){
    for(j=0;j<chosen.length;j++){
      if(cellDist(z,chosen[j])<minD) return false;
      if(Math.abs(cr(z).c-cr(chosen[j]).c)<minCol) return false;
    }
    return true;
  }
  // ①左右2列以上かつ距離2.2以上 → ②左右2列以上 → ③左右1列以上 → ④残りから
  var rules=[[2.2,2],[1.8,2],[1.4,1],[0,0]];
  for(var r=0;r<rules.length && chosen.length<1+extra;r++)
    for(i=0;i<pool.length && chosen.length<1+extra;i++)
      if(chosen.indexOf(pool[i])<0 && ok(pool[i],rules[r][0],rules[r][1])) chosen.push(pool[i]);
  return chosen;
}
function glowAlpha(z, gz, progress, react){
  var start=(1-react/100)*0.5+0.14, conf=Math.max(0,Math.min(1,(progress-start)/(1-start)));
  if(conf<=0) return 0;
  var s0=1.0+(1-react/100)*2.0, sigma=s0*(1.3-0.22*conf), d=cellDist(z,gz);
  return Math.min(0.5, conf*Math.exp(-(d*d)/(2*sigma*sigma))*0.44*LV().glowMul);
}
// 位置補正：GKの定位置（中央・地面付近）から遠いゾーンほど届きにくい
// 横のズレは「守備範囲」、上段の高さは「ハイボール」で軽減される
function posPenalty(zone, gk){
  var p=cr(zone);
  var side=Math.abs(p.c-1.5)/1.5;   // 端=1.0 / 内側=0.333
  var high=(p.r===0)?1:0;           // 上段だけ
  return Math.min(0.85,
      0.45*side*(1-gk.守備範囲/100*0.5)
    + 0.50*high*(1-gk.ハイボール/100*0.55));
}
// セーブ判定（GK能力 × キッカー能力）。saved=true ならGKの勝ち
function resolveSave(target, committed, gk, kicker, candidates, oppGK){
  if(committed==null) return { saved:false, reason:"跳べなかった…", stat:"反応", power:false, hold:false };
  var d=cellDist(target, committed), topRow=cr(target).r===0;
  var reachCells=0.90+(gk.守備範囲/100)*1.19, pReach=(reachCells-d)/reachCells;
  var wrongCand = committed!==target && candidates && candidates.indexOf(committed)>=0;
  if(pReach<=0){
    if(wrongCand) return { saved:false, reason:"別の狙いに釣られた…", stat:"フェイント力", power:false, hold:false };
    return { saved:false, reason: d>=2.5?"逆を突かれた！":"そこまで届かなかった…", stat: topRow?"ハイボール":"守備範囲", power:false, hold:false };
  }
  pReach=Math.min(1,pReach)*(1-posPenalty(target,gk));
  if(pReach<=0){
    if(wrongCand) return { saved:false, reason:"別の狙いに釣られた…", stat:"フェイント力", power:false, hold:false };
    return { saved:false, reason:"コースが遠すぎた…", stat: topRow?"ハイボール":"守備範囲", power:false, hold:false };
  }
  // 上限を先に適用してから押し込みを引く（順序を逆にするとキック力が吸収され無効化する）
  var chance=Math.min(96, (0.42+(gk.メンタル/100)*1.18)*pReach*100);
  var push=kicker.キック力*0.23*(1-(gk.メンタル/100)*0.4);
  chance=Math.max(0, chance-push);
  if(oppGK) chance=Math.min(96, chance*LV().saveMul);   // 難易度：相手GKのときだけ効く
  var saved=Math.random()*100<chance, near=d<0.5;
  if(saved) return { saved:true, reason: near?"読み切ってキャッチ！":"手を伸ばして弾いた！", stat: near?"メンタル":(topRow?"ハイボール":"守備範囲"), power:false, hold:near };
  if(near) return { saved:false, reason:"読み勝ったが押し込まれた…", stat:"キック力", power:true, hold:false };
  if(wrongCand) return { saved:false, reason:"別の狙いに釣られた…", stat:"フェイント力", power:false, hold:false };
  return { saved:false, reason:"あと一歩、届かず…", stat:"守備範囲", power:false, hold:false };
}
// 攻撃時：相手GKがあなたのコースをどこと読むか
function neighborZone(z){ var n=allZones().filter(function(i){ var d=cellDist(i,z); return d>0&&d<1.5; }); return n[Math.floor(Math.random()*n.length)]; }
function farZone(z){ var f=allZones().filter(function(i){ return cellDist(i,z)>=2; }); return f.length? f[Math.floor(Math.random()*f.length)] : neighborZone(z); }
function keeperGuess(shot, gk, kicker){
  var read=Math.max(0.06, Math.min(0.94, gk.反応/100 - kicker.フェイント力/160));
  if(Math.random()<read) return Math.random()<0.6 ? shot : neighborZone(shot);
  return farZone(shot);
}
// 端ほど枠を外しやすい（正確性が高いほど外しにくい）
function edgeFactor(zone){ var p=cr(zone); var colN=Math.abs(p.c-1.5)/1.5, rowN=(p.r===0)?1.42:((p.r===1)?0:1.00); return Math.min(1,(colN+rowN)/2*1.25); }
function missWide(kicker, zone){ var acc=kicker.正確性!=null?kicker.正確性:60; return Math.random() < edgeFactor(zone)*(1-acc/100)*0.70; }
// シュートの候補数(=1+extra)。フェイント力で分かれ、反応の高いGKだけ1つ絞れる（分けるキッカーには最低2択残す）
function candidateExtra(kicker, gk){
  var extra=Math.floor(kicker.フェイント力/33);          // フェイント力90+→2(3手), 33-65→1(2手), それ未満→0(1手)
  if(extra>=1 && gk.反応>=85) extra=Math.max(1, extra-1); // 高反応GKは1つ絞る。ただし2択は残る

function tuDefend(split){
  clearTimers(); app.innerHTML=""; ui={}; TU.busy=false; TU.step=split?3:2;
  tuHead(split?3:2, split?"まとが散らばる":"つぎは止めてみよう");
  app.appendChild(tuBox(split
    ? "フェイント力がたかい選手は、光が2つに散らばる。\nどちらが本命かは分からない。かんで選ぶしかない。"

  tuPitch("#4bc0e8", true);
  var st=h("div","min-height:76px;margin-top:10px"); ui.status=st; app.appendChild(st);
  st.appendChild(h("p","text-align:center;color:"+C.sub+";font-size:13px;margin-top:10px","ボタンを押すと助走がはじまる"));
  var gk={反応:85,守備範囲:85,ハイボール:85,メンタル:90};
  var kicker={name:"れんしゅう",フェイント力:split?95:10,キック力:50,正確性:99};
  st.appendChild(bigButton("受けて立つ","#4bc0e8",function(){
    st.innerHTML=""; st.appendChild(h("p","text-align:center;color:"+C.ball+";font-weight:800;font-size:16px;margin-top:14px","→ 本命だと思うマスをタップ！"));
    var t=Math.floor(Math.random()*ZONES);
    var cands=pickCandidates(t, split?1:0);
    var committed=null;
    ui.cells.forEach(function(c){ c.style.cursor="pointer"; });
    ui.onCell=function(z){ if(committed!=null) return; committed=z;
      ui.cells[z].style.border="2px solid #4bc0e8"; diveKeeper(z); };
    ui.runner.style.opacity="1";
    var t0=performance.now(), DUR=2600;
    (function loop(now){
      var p=Math.min(1,(now-t0)/DUR);
      for(var z2=0;z2<ZONES;z2++){ if(committed===z2) continue;
        var a=0; for(var ci=0;ci<cands.length;ci++) a=Math.max(a, glowAlpha(z2,cands[ci],p,gk.反応)*1.5);
        a=Math.min(0.55,a);

      ui.runner.style.left=(22+(50-22)*Math.min(1,p/0.85))+"%";
      if(p<1) raf=requestAnimationFrame(loop);
      else {
        ui.runner.style.opacity="0";
        flyBallTo(t,FLIGHT_MS,function(){
          ui.ballInner.style.animation="none";
          var res=resolveSave(t,committed,gk,kicker,cands);
          ui.cells[t].style.background = res.saved?"rgba(53,224,122,0.28)":"rgba(255,90,95,0.28)";
          if(res.saved){ if(res.hold) catchEffect(t); else deflectBall(t); crowds(true); }
          else { if(res.power) powerBlast(t); crowds(false); }
          // 跳んだ先とボールの距離で文言を変える（となりでも守備範囲が届けば止まる）
          var dist=(committed==null)?99:cellDist(t,committed);
          var how = res.saved
            ? (dist<0.5 ? "ズバリ当てた！"
                        : (dist<1.5 ? "となりだったが、守備範囲がひろいので手がとどいた！"
                                    : "はなれていたのに、守備範囲でとどいた！"))
            : (dist<0.5 ? "コースは当てたのに、キック力で押し込まれた…"
                        : (dist<1.5 ? "おしい。となりだったが、とどかなかった…"
                                    : "はなれすぎて、とどかなかった…"));
          if(split) tuResult(res.saved?"セーブ！":"きめられた…",
              res.saved? how : "2つに散ると当てるのは難しい。それでいい。",
              res.saved?C.save:C.goal, tuDone,"おわり ›");
          else tuResult(res.saved?"セーブ！":"とめられなかった…", how,
              res.saved?C.save:C.goal, res.saved?tuRead:tuSave, res.saved?"つぎへ ›":"もう一度");
        });
      }
    })(performance.now());
  }));
}

// おまかせ抽選。難易度に応じて相手の強さを寄せる（イージー=弱め／ハード=強め）
// 完全に切り分けず確率で寄せる。調べた実在選手がどのレベルでも出てくるようにするため。
function pickWeighted(pool, n){
  var bias=LV().pool;
  if(!bias) return shuffle(pool).slice(0,n);
  var sorted=pool.slice().sort(function(a,b){ return (b.star||1)-(a.star||1); });
  var half=Math.ceil(sorted.length/2);
  var strong=sorted.slice(0,half), weak=sorted.slice(half);
  var favored=(bias>0)?strong:weak, other=(bias>0)?weak:strong;
  var fa=shuffle(favored), ot=shuffle(other), out=[];
  while(out.length<n && (fa.length||ot.length)){
    var useFav = (Math.random()<0.72 && fa.length) || !ot.length;
    out.push(useFav ? fa.pop() : ot.pop());
  }
  return out;
}
function randGK(){ return pickWeighted(KEEPERS,1)[0]; }
function randKickers(n){ return pickWeighted(KICKERS,n); }

  ui.cells[z].style.border="2px solid "+S.youTeam.color;
  ui.status.innerHTML="";
  ui.status.appendChild(h("p","text-align:center;color:"+C.ball+";font-weight:800;font-size:17px;margin-top:20px","シュート！"));
  var guess=keeperGuess(z, opp, you); S.guess=guess; diveKeeper(guess);
  if(missWide(you, z)){
    S.ao={ goal:false, wide:true }; crowds(false);
    flyBallWide(z, function(){ ui.ballInner.style.animation="none"; S.youMarks.push(false); attackResult(); });
    return;
  }
  flyBallTo(z, FLIGHT_MS, function(){
    var res=resolveSave(z, guess, opp, you, [z], true);
    var goal=!res.saved; S.ao={ goal:goal, res:res };
    ui.ballInner.style.animation="none";
    if(goal){ ui.cells[z].style.background="rgba(255,210,63,0.30)"; S.youScore++; goalBurst(z, S.youTeam.color); crowds(true); }
    else { ui.cells[z].style.background="rgba(53,224,122,0.28)"; if(res.hold) catchEffect(z); else deflectBall(z); crowds(false); }
    S.youMarks.push(goal);
    attackResult();
  });
}
// ゴール時の一言は「GKが実際にどこへ跳んだか」から決める（固定文だと嘘になる）
function attackReason(){
  if(S.guess==null) return "相手GKは跳べなかった！";
  var d=cellDist(S.shot, S.guess);
  if(d<0.5)  return "コースは読まれていた…キック力で押し込んだ！";
  if(d<1.5)  return "相手GKの手が、あと一歩届かなかった！";
  if(d<2.5)  return "相手GKは別のコースを読んでいた！";
  return "相手GKの逆を突いた！";
}
function attackResult(){
  var s=ui.status; s.innerHTML=""; var goal=S.ao.goal, wide=S.ao.wide;
  var big = goal?"ゴール！！":(wide?"枠外…":"とめられた…");
  var col = goal?C.ball:(wide?C.sub:C.save);
  var sub = goal?attackReason():(wide?"コースを狙いすぎて外した…":("相手GK："+S.ao.res.reason));
  s.appendChild(h("div","text-align:center;font-size:30px;font-weight:900;color:"+col, big));
  s.appendChild(h("div","text-align:center;color:"+C.sub+";font-size:12px;margin:2px 0 10px", sub));
  if(S.mode==="kick") s.appendChild(bigButton("次へ", S.youTeam.color, endRound));
  else if(decidedNow()) s.appendChild(bigButton("結果を見る", S.youTeam.color, renderResult));
  else s.appendChild(bigButton("相手のキックへ（守る）", S.youTeam.color, enterDefend));
}

/* ===== 守備（相手が蹴る）===== */
function startDefend(){
  clearTimers(); S.turn="defend"; S.phase="ready"; S.dtarget=null; S.candidates=[]; S.committed=null; S.progress=0; S.dout=null;
  renderDefend();
}
function renderDefend(){
  app.innerHTML=""; ui={};
  var gk=S.youTeam.gk, kicker=oppKicker();
  app.appendChild(navBar(null));
  app.appendChild(scoreboard());
  app.appendChild(marksBar());
  app.appendChild(h("div","text-align:center;font-size:15px;font-weight:800;color:"+S.oppTeam.color+";margin:2px 0 2px","▶ 相手のキック（"+S.round+"人目・守る）"));
  // 相手キッカー情報
  var info=h("div","display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2px");
  info.appendChild(avatarBox(kicker.name, kicker.color, 26));
  info.appendChild(h("span","font-size:13px;font-weight:700;color:"+C.ink,kicker.name));
  info.appendChild(h("span","font-size:11px;color:"+C.gold,stars(kicker.star)));
  app.appendChild(info);
  var pitch=buildPitch(gk.color); app.appendChild(pitch);
  var status=h("div","min-height:92px;margin-top:10px"); ui.status=status; app.appendChild(status);
  ui.onCell=commit;
  requestAnimationFrame(placeKeeperRest);
  defendStatus();
}
function defendStatus(){
  var s=ui.status; s.innerHTML=""; var gk=S.youTeam.gk;
  if(S.phase==="ready"){
    var marks=1+candidateExtra(oppKicker(), gk);
    var p=h("p","color:"+C.sub+";font-size:13px;text-align:center;margin:0 0 8px;line-height:1.6");
    p.innerHTML='助走で<span style="color:'+C.ball+'">読みの光</span>が出る。'+(marks>=2?('<span style="color:'+C.goal+'">まとが'+marks+'つ</span>に散らばる！'):'')+'<br>本命だと思うマスをタップ（蹴る直前でロック）。';
    s.appendChild(p);
    s.appendChild(bigButton("受けて立つ", gk.color, startKick));
  } else if(S.phase==="runup"||S.phase==="strike"){
    s.appendChild(h("p","text-align:center;color:"+C.ball+";font-weight:800;font-size:17px;margin-top:20px", S.committed==null?"→ フォームを読んでタップ！":"跳んだ！"));
  } else if(S.phase==="resolved"&&S.dout){
    var o=S.dout, conceded=!o.saved;
    s.appendChild(h("div","text-align:center;font-size:30px;font-weight:900;color:"+(o.saved?C.save:C.goal), o.saved?(o.wide?"枠外！":"セーブ！"):"きめられた…"));
    var tag=(o.stat==="フェイント力"&&!o.saved)?"【フェイント】":"";
    s.appendChild(h("div","color:"+C.ink+";font-size:14px;margin:2px 0 4px;text-align:center", tag+o.reason));
    s.appendChild(h("div","color:"+C.sub+";font-size:12px;margin-bottom:10px;text-align:center","効いた能力："+o.stat));
    s.appendChild(bigButton("次へ", S.youTeam.color, endRound));
  }
}
function startKick(){
  if(S.phase!=="ready") return;
  var gk=S.youTeam.gk, kicker=oppKicker();
  var t=Math.floor(Math.random()*ZONES);
  var extra=Math.max(0, candidateExtra(kicker, gk)+LV().candAdj);
  var cands=pickCandidates(t, extra); S.dtarget=t; S.candidates=cands;
  S.committed=null; S.dout=null; S.progress=0; S.phase="runup"; defendStatus(); SFX.whistle();
  ui.runner.style.opacity="1"; ui.staticBall.style.display="block";
  var avgc=0; cands.forEach(function(z){ avgc+=cr(z).c; }); avgc/=cands.length;
  var fromLeft=avgc>=1.5, startX=fromLeft?22:78, emphasis=0;
  var t0=performance.now();
  function loop(now){
    var p=Math.min(1,(now-t0)/LV().runupMs); S.progress=p;
    for(var z=0;z<ZONES;z++){ if(S.committed===z) continue;
      var a=0; for(var ci=0;ci<cands.length;ci++){ var w=(cands[ci]===t)?(1+emphasis):(1-emphasis*0.6); a=Math.max(a, glowAlpha(z,cands[ci],p,gk.反応)*w); }
      a=Math.min(0.5,a); ui.cells[z].style.background = a>0.02 ? "rgba(255,210,63,"+a+")":"rgba(255,255,255,0.05)"; }
    var runP=Math.min(1,p/0.85), kx=startX+(50-startX)*runP, pose=p>=0.82;
    ui.runner.style.left=kx+"%"; ui.runner.style.transform="translateX(-50%) rotate("+(pose?(fromLeft?14:-14):0)+"deg)";
    if(p<1) raf=requestAnimationFrame(loop); else defendStrike(t);
  }
  raf=requestAnimationFrame(loop);
}
function commit(z){
  if(S.phase!=="runup"||S.progress>=LOCK) return;
  if(S.committed!=null) ui.cells[S.committed].style.border="1px solid rgba(255,255,255,0.12)";
  S.committed=z; ui.cells[z].style.border="2px solid "+S.youTeam.gk.color; diveKeeper(z); defendStatus();
}
function defendStrike(t){
  S.phase="strike"; defendStatus(); ui.runner.style.opacity="0";
  if(missWide(oppKicker(), t)){
    diveKeeper(S.committed!=null ? S.committed : t);   // 枠外でもキーパーは跳ぶ
    S.dout={ saved:true, wide:true, reason:"相手が枠を外した！", stat:"正確性", hold:false, power:false };
    S.phase="resolved"; S.saves++; S.oppMarks.push(false); crowds(true);
    flyBallWide(t, function(){ ui.ballInner.style.animation="none"; defendStatus(); });
    return;
  }
  flyBallTo(t, FLIGHT_MS, function(){
    var res=resolveSave(t, S.committed, S.youTeam.gk, oppKicker(), S.candidates);
    S.dout=res; S.phase="resolved";
    if(res.saved) S.saves++; else S.oppScore++;
    S.oppMarks.push(!res.saved);
    ui.ballInner.style.animation="none";
    ui.cells[t].style.background = res.saved ? "rgba(53,224,122,0.28)":"rgba(255,90,95,0.28)";
    if(res.saved){ if(res.hold) catchEffect(t); else deflectBall(t); crowds(true); }
    else { if(res.power) powerBlast(t); crowds(false); }
    defendStatus();
  });
}

/* ---------- ラウンド終了 → 勝敗判定 ---------- */
function endRound(){
  if(S.mode!=="vs"){
    if(S.round<ROUNDS){ beginRound(S.round+1); return; }
    renderResult(); return;
  }
  if(decidedNow()){ renderResult(); return; }        // 途中決着（逆転不可能なら終了）
  var decided = S.youScore!==S.oppScore;
  if(!S.sudden){
    if(S.round<ROUNDS){ beginRound(S.round+1); return; }
    if(decided){ renderResult(); return; }
    S.sudden=true; beginRound(S.round+1); return;   // サドンデス突入
  }
  // サドンデス：1ラウンド終わって差がついたら決着
  if(decided){ renderResult(); return; }
  beginRound(S.round+1);
}
// PK戦の途中決着：残りキックで逆転できないなら true
function decidedNow(){
  if(S.sudden) return false;
  var yr=ROUNDS-S.youMarks.length, or=ROUNDS-S.oppMarks.length;
  return (S.youScore > S.oppScore+or) || (S.oppScore > S.youScore+yr);
}

/* ---------- 結果 ---------- */
function rating(n){ return n>=5?"パーフェクト！":n>=4?"すごい！":n>=3?"good":n>=1?"つぎがんばろう":"どんまい"; }
function renderResult(){
  clearTimers(); app.innerHTML="";
  var wrap=h("div","text-align:center;animation:gkIn 340ms ease-out");
  wrap.appendChild(h("div","color:"+C.sub+";font-size:12px;letter-spacing:3px;margin-bottom:8px","RESULT"));
  wrap.appendChild(marksBar());
  if(S.mode==="vs"){
    var win=S.youScore>S.oppScore;
    wrap.appendChild(h("div","font-size:46px;font-weight:900;margin:6px 0;color:"+(win?C.save:C.goal), win?"WIN！":"LOSE…"));
    wrap.appendChild(h("div","font-size:40px;font-weight:900;color:"+C.ink, S.youScore+" - "+S.oppScore));
    var t=h("div","display:flex;gap:10px;justify-content:center;margin:10px 0 18px;color:"+C.sub+";font-size:13px");
    t.appendChild(h("span",null,S.youTeam.name)); t.appendChild(h("span",null,"vs")); t.appendChild(h("span",null,S.oppTeam.name)); wrap.appendChild(t);
  } else {
    var n = S.mode==="kick" ? S.youScore : S.saves;
    var lab = S.mode==="kick" ? "ゴール" : "セーブ";
    var col = S.mode==="kick" ? C.ball : C.save;
    wrap.appendChild(h("div","font-size:46px;font-weight:900;margin:6px 0;color:"+col, n+" / "+ROUNDS));
    wrap.appendChild(h("div","font-size:18px;color:"+C.ink+";margin-bottom:4px",lab));
    wrap.appendChild(h("div","font-size:16px;color:"+C.sub+";margin-bottom:18px",rating(n)));
  }
  wrap.appendChild(bigButton("もう一度（モード選択へ）", S.youTeam?S.youTeam.color:"#4bc0e8", function(){ resetGame(); renderModeSelect(); }));
  app.appendChild(wrap);
  if(S.mode==="vs" && S.youScore>S.oppScore){ launchFireworks(); SFX.win(); }
  else if(S.mode==="vs" && S.youScore<S.oppScore){ launchRain(); SFX.lose(); }
}
function launchRain(){
  var layer=h("div","position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:49;background:rgba(20,30,40,0.18)");
  layer.id="rainLayer";
  for(var i=0;i<70;i++){
    var x=Math.random()*100, dur=0.5+Math.random()*0.5, delay=Math.random()*1.2, len=8+Math.random()*10;
    var d=h("div","position:absolute;left:"+x+"%;top:0;width:1.5px;height:"+len+"px;background:linear-gradient(rgba(255,255,255,0),rgba(180,205,225,0.6));animation:rainFall "+dur+"s linear "+delay+"s infinite");
    layer.appendChild(d);
  }
  document.body.appendChild(layer);
  setTimeout(function(){ if(layer.parentNode) layer.parentNode.removeChild(layer); }, 6000);
}
function launchFireworks(){
  var layer=h("div","position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50");
  document.body.appendChild(layer);
  var colors=["#ffd23f","#35e07a","#ff5a5f","#4bc0e8","#e8b84b","#c65fb0"], n=0;
  function burst(){
    if(n++>=7){ setTimeout(function(){ if(layer.parentNode) layer.parentNode.removeChild(layer); }, 1200); return; }
    var cx=12+Math.random()*76, cy=10+Math.random()*45;
    var b=h("div","position:absolute;left:"+cx+"%;top:"+cy+"%");
    var base=colors[Math.floor(Math.random()*colors.length)];
    for(var i=0;i<14;i++){
      var ang=(i/14)*Math.PI*2, dist=34+Math.random()*24;
      var p=h("span","position:absolute;width:6px;height:6px;border-radius:50%;background:"+base);
      p.style.setProperty("--dx",(Math.cos(ang)*dist)+"px");
      p.style.setProperty("--dy",(Math.sin(ang)*dist)+"px");
      p.style.animation="fwBurst 900ms ease-out forwards";
      b.appendChild(p);
    }
    layer.appendChild(b); SFX.firework();
    setTimeout(function(){ if(b.parentNode) b.parentNode.removeChild(b); }, 950);
    setTimeout(burst, 420+Math.random()*360);
  }
  burst();
}

renderTitle();
</script>
