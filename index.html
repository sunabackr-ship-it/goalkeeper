// モブ（雑魚）を自動生成してプールに混ぜる
function makeMobs(kind, n){
  var names=["ざこ","へたっぴ","ぼんやり","もたもた","ぐだぐだ","のんびり","よわよわ","ぽんこつ","ヘロヘロ","ふぬけ"];
  var cols=["#8a8f98","#7f8a80","#8f8577","#79808a","#8a7f8a","#808a86"];
  var arr=[];
  for(var i=0;i<n;i++){
    var nm=names[i%names.length]+(kind==="gk"?"GK":"")+"・"+(i+1);
    var col=cols[i%cols.length], star=1+(i%2);
    if(kind==="gk") arr.push({ name:nm, color:col, star:star, note:"モブ｜雑魚キャラ。", 反応:20+(i*7)%26, 守備範囲:24+(i*5)%26, ハイボール:22+(i*9)%26, メンタル:23+(i*11)%26 });
    else arr.push({ name:nm, color:col, star:star, note:"モブ｜雑魚キャラ。", だまし:8+(i*7)%22, キック力:14+(i*13)%34 });
  }
  return arr;
}
var KEEPERS = REAL_GKS.concat(makeMobs("gk", 10));
var KICKERS = REAL_KICKERS.concat(makeMobs("fw", 16));
/* ▲▲▲ 書き換えるのはここまで ▲▲▲ */

var COLS=4, ROWS=3, ZONES=COLS*ROWS, RUNUP_MS=1800, FLIGHT_MS=200, LOCK=0.9, ROUNDS=5;
var C = { pitch:"#123f27", line:"rgba(255,255,255,0.8)", ball:"#ffd23f",
  save:"#35e07a", goal:"#ff5a5f", ink:"#f2f7f3", sub:"#9fc3ac", gold:"#e8b84b", mob:"#7f9d8b" };

function cr(z){ return { c: z % COLS, r: Math.floor(z / COLS) }; }
function cellDist(a,b){ var A=cr(a),B=cr(b); return Math.hypot(A.c-B.c, A.r-B.r); }
function allZones(){ var a=[]; for(var i=0;i<ZONES;i++) a.push(i); return a; }
function shuffle(a){ var x=a.slice(); for(var i=x.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=x[i]; x[i]=x[j]; x[j]=t; } return x; }
function pickCandidates(t, extra){
  var pool=shuffle(allZones()).filter(function(z){ return z!==t; }), chosen=[t], i, j, ok;
  for(i=0;i<pool.length && chosen.length<1+extra;i++){ ok=true; for(j=0;j<chosen.length;j++){ if(cellDist(pool[i],chosen[j])<1.2){ ok=false; break; } } if(ok) chosen.push(pool[i]); }
  for(i=0;i<pool.length && chosen.length<1+extra;i++){ if(chosen.indexOf(pool[i])<0) chosen.push(pool[i]); }
  return chosen;
}
function glowAlpha(z, gz, progress, react){
  var start=(1-react/100)*0.55+0.07, conf=Math.max(0,Math.min(1,(progress-start)/(1-start)));
  if(conf<=0) return 0;
  var s0=0.7+(1-react/100)*1.9, sigma=s0*(1.38-0.33*conf), d=cellDist(z,gz);
  return Math.min(0.46, conf*Math.exp(-(d*d)/(2*sigma*sigma))*0.48);
}
// セーブ判定（GK能力 × キッカー能力）。saved=true ならGKの勝ち
function resolveSave(target, committed, gk, kicker, candidates){
  if(committed==null) return { saved:false, reason:"跳べなかった…", stat:"反応", power:false, hold:false };
  var d=cellDist(target, committed), topRow=cr(target).r===0;
  var reachCells=0.52+(gk.守備範囲/100)*1.18, pReach=(reachCells-d)/reachCells;
  if(topRow) pReach += ((gk.ハイボール-60)/100)*0.47;
  var wrongCand = committed!==target && candidates && candidates.indexOf(committed)>=0;
  if(pReach<=0){
    if(wrongCand) return { saved:false, reason:"別の狙いに釣られた…", stat:"だまし", power:false, hold:false };
    return { saved:false, reason: d>=2.5?"逆を突かれた！":"そこまで届かなかった…", stat: topRow?"ハイボール":"守備範囲", power:false, hold:false };
  }
  pReach=Math.min(1,pReach);
  var chance=(0.44+(gk.メンタル/100)*0.44)*pReach*100;
  var push=kicker.キック力*0.35*(1-(gk.メンタル/100)*0.4);
  chance=Math.max(0, Math.min(96, chance-push));
  var saved=Math.random()*100<chance, near=d<0.5;
  if(saved) return { saved:true, reason: near?"読み切ってキャッチ！":"手を伸ばして弾いた！", stat: near?"メンタル":(topRow?"ハイボール":"守備範囲"), power:false, hold:near };
  if(near) return { saved:false, reason:"読み勝ったが押し込まれた…", stat:"キック力", power:true, hold:false };
  if(wrongCand) return { saved:false, reason:"別の狙いに釣られた…", stat:"だまし", power:false, hold:false };
  return { saved:false, reason:"あと一歩、届かず…", stat:"守備範囲", power:false, hold:false };
}
// 攻撃時：相手GKがあなたのコースをどこと読むか
function neighborZone(z){ var n=allZones().filter(function(i){ var d=cellDist(i,z); return d>0&&d<1.5; }); return n[Math.floor(Math.random()*n.length)]; }
function farZone(z){ var f=allZones().filter(function(i){ return cellDist(i,z)>=2; }); return f.length? f[Math.floor(Math.random()*f.length)] : neighborZone(z); }
function keeperGuess(shot, gk, kicker){
  var read=Math.max(0.06, Math.min(0.94, gk.反応/100 - kicker.だまし/160));
  if(Math.random()<read) return Math.random()<0.6 ? shot : neighborZone(shot);
  return farZone(shot);
}

// 人型キーパー（24×24ドット絵。ユニフォームはチームのGK色）
function keeperSVG(color){
  var g="#f4f4f4", s="#f1c9a2", hair="#3a2a20", eye="#20303a", p="#22303a", b="#12181c", sh=shade(color);
  var px=[
    [3,0,3,3,g],[18,0,3,3,g],
    [5,3,2,2,color],[6,5,2,2,color],[7,7,2,2,color],[8,9,2,2,color],
    [17,3,2,2,color],[16,5,2,2,color],[15,7,2,2,color],[14,9,2,2,color],
    [9,4,6,2,hair],[9,6,1,3,hair],[14,6,1,3,hair],
    [10,6,4,5,s],
    [10,8,1,1,eye],[13,8,1,1,eye],
    [7,11,10,2,color],[8,13,8,5,color],[8,13,1,5,sh],[15,13,1,5,sh],
    [8,18,8,2,p],
    [8,20,3,3,p],[13,20,3,3,p],
    [8,23,4,1,b],[13,23,4,1,b]
  ];
  var r=""; px.forEach(function(a){ r+='<rect x="'+a[0]+'" y="'+a[1]+'" width="'+a[2]+'" height="'+a[3]+'" fill="'+a[4]+'"/>'; });
  return '<svg width="34" height="34" viewBox="0 0 24 24" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">'+r+'</svg>';
}
function shade(hex){
  var m=/^#?([0-9a-f]{6})$/i.exec(hex); if(!m) return hex;
  var n=parseInt(m[1],16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
  r=Math.round(r*0.7); g=Math.round(g*0.7); b=Math.round(b*0.7);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
// 顔イラスト（名前から自動生成）
function hashStr(s){ var h=5381; for(var i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return Math.abs(h); }
function avatarSVG(name, color){
  var seed=hashStr(name||"x");
  var skins=["#f4cda6","#eabb8a","#d79a6b","#c88a5a","#f0c19a"], hairs=["#2a2320","#4a2f1d","#12100f","#5c3a1c","#6f4a2a","#3b2a22","#8a5a34"];
  var skin=skins[seed%skins.length], hair=hairs[Math.floor(seed/5)%hairs.length];
  var hstyle=seed%3, mouth=Math.floor(seed/7)%3, browY=48+((seed%2)?0:2);
  var hairPath = hstyle===0 ? '<path d="M27,46 Q30,22 50,22 Q70,22 73,46 Q66,34 50,33 Q34,34 27,46 Z" fill="'+hair+'"/>'
    : hstyle===1 ? '<path d="M28,46 L33,28 L40,40 L46,25 L52,40 L59,26 L66,41 L72,46 Q60,34 50,33 Q38,34 28,46 Z" fill="'+hair+'"/>'
    : '<path d="M29,45 Q32,28 50,28 Q68,28 71,45 Q64,38 50,37 Q36,38 29,45 Z" fill="'+hair+'" opacity="0.92"/>';
  var mouthPath = mouth===0 ? '<path d="M43,70 Q50,76 58,69" stroke="#6b3b2e" stroke-width="2.5" fill="none" stroke-linecap="round"/>'
    : mouth===1 ? '<line x1="44" y1="71" x2="57" y2="71" stroke="#6b3b2e" stroke-width="2.5" stroke-linecap="round"/>'
    : '<ellipse cx="50" cy="72" rx="5" ry="4" fill="#7a3b30"/>';
  return '<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">'
    + '<circle cx="50" cy="50" r="48" fill="'+color+'" opacity="0.16"/><circle cx="50" cy="50" r="47" fill="none" stroke="'+color+'" stroke-width="3"/>'
    + '<path d="M20,94 Q50,70 80,94 L80,100 L20,100 Z" fill="'+color+'"/>'
    + '<ellipse cx="50" cy="56" rx="21" ry="25" fill="'+skin+'"/><circle cx="28.5" cy="56" r="4" fill="'+skin+'"/><circle cx="71.5" cy="56" r="4" fill="'+skin+'"/>'
    + hairPath + '<circle cx="42" cy="57" r="3" fill="#243040"/><circle cx="58" cy="57" r="3" fill="#243040"/>'
    + '<line x1="37" y1="'+browY+'" x2="46" y2="'+(browY-1)+'" stroke="'+hair+'" stroke-width="2.5" stroke-linecap="round"/>'
    + '<line x1="54" y1="'+(browY-1)+'" x2="63" y2="'+browY+'" stroke="'+hair+'" stroke-width="2.5" stroke-linecap="round"/>'
    + mouthPath + '</svg>';
}
function stars(n){ n=Math.max(0,Math.min(5, n|0)); return "★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n); }
function keeperTags(gk){
  var m=[["鋭い読み",gk.反応],["広い守備範囲",gk.守備範囲],["ハイボールに強い",gk.ハイボール],["強いメンタル",gk.メンタル]];
  m.sort(function(a,b){ return b[1]-a[1]; }); return [m[0][0], m[1][0]];
}
function kickerTags(k){
  var t=[]; if(k.だまし>=70) t.push("フェイントの名手"); else if(k.だまし>=45) t.push("かけひき上手");
  if(k.キック力>=85) t.push("超強烈なシュート"); else if(k.キック力>=60) t.push("強いキック力");
  if(t.length===0) t.push("正攻法タイプ"); return t;
}

function placeKeeperRest(){
  if(!ui.grid||!ui.keeper) return;
  var gr=ui.grid.getBoundingClientRect();
  ui.keeper._restX=gr.width/2; ui.keeper._restY=gr.height*0.72;
  ui.keeper.style.transition="none"; ui.keeper.style.opacity="1";
  ui.keeper.style.transform="translate(-50%,-50%) translate("+ui.keeper._restX+"px,"+ui.keeper._restY+"px) rotate(0deg)";
  ui.keeperInner.style.transition="none"; ui.keeperInner.style.transform="scale(1)";
  requestAnimationFrame(function(){ if(ui.keeper) ui.keeper.style.transition="transform 240ms cubic-bezier(.3,.7,.4,1)"; });
}
function diveKeeper(z){
  if(!ui.grid||!ui.keeper) return;
  var gr=ui.grid.getBoundingClientRect(), c=ui.cells[z].getBoundingClientRect();
  var tx=c.left+c.width/2-gr.left, ty=c.top+c.height/2-gr.top;
  var restX=ui.keeper._restX!=null?ui.keeper._restX:gr.width/2;
  var angle=Math.max(-80,Math.min(80,(tx-restX)/gr.width*160));
  ui.keeper.style.transition="transform 240ms cubic-bezier(.25,.8,.35,1)";
  ui.keeper.style.transform="translate(-50%,-50%) translate("+tx+"px,"+ty+"px) rotate("+angle+"deg)";
  ui.keeperInner.style.transition="transform 240ms ease-out"; ui.keeperInner.style.transform="scale(1.15)";
}
function flyBallTo(z, dur, cb){
  var gr=ui.grid.getBoundingClientRect(), c=ui.cells[z].getBoundingClientRect();
  var tx=c.left+c.width/2-gr.left, ty=c.top+c.height/2-gr.top, b=ui.ball;
  ui.staticBall.style.display="none";
  b.style.transition="none"; b.style.opacity="1";
  b.style.transform="translate(-50%,-50%) translate("+(gr.width/2)+"px,"+(gr.height+30)+"px)";
  ui.ballInner.style.animation="gkSpin 400ms linear infinite";
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    b.style.transition="transform "+dur+"ms cubic-bezier(.3,.6,.5,1)";
    b.style.transform="translate(-50%,-50%) translate("+tx+"px,"+ty+"px)";
  });});
  flightTimer=setTimeout(cb, dur+40);
}
function flashCell(z,col){

  cell.appendChild(f); setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); }, 470);
}
function powerBlast(t){
  ui.ballInner.style.transition="transform 90ms ease-out"; ui.ballInner.style.transform="scale(1.6)";
  setTimeout(function(){ if(ui.ballInner) ui.ballInner.style.transform="scale(1)"; }, 130);
  if(ui.keeper&&ui.grid){ var gr=ui.grid.getBoundingClientRect(), c=ui.cells[t].getBoundingClientRect();
    var tx=c.left+c.width/2-gr.left, ty=c.top+c.height/2-gr.top, restX=ui.keeper._restX!=null?ui.keeper._restX:gr.width/2, dir=tx>=restX?1:-1;
    ui.keeper.style.transition="transform 160ms ease-out";
    ui.keeper.style.transform="translate(-50%,-50%) translate("+(tx+dir*10)+"px,"+(ty+8)+"px) rotate("+(dir*95)+"deg)"; }
  if(ui.frame){ ui.frame.style.animation="gkShake 260ms ease-in-out"; setTimeout(function(){ if(ui.frame) ui.frame.style.animation="none"; },300); }
}
function deflectBall(t){
  flashCell(t,C.save);
  ui.keeperInner.style.transition="transform 120ms ease-out"; ui.keeperInner.style.transform="scale(1.3)";
  setTimeout(function(){ if(ui.keeperInner) ui.keeperInner.style.transform="scale(1.12)"; },260);
  if(!ui.grid) return;
  var gr=ui.grid.getBoundingClientRect(), c=ui.cells[t].getBoundingClientRect();
  var tx=c.left+c.width/2-gr.left, ty=c.top+c.height/2-gr.top, restX=ui.keeper&&ui.keeper._restX!=null?ui.keeper._restX:gr.width/2, dir=tx>=restX?1:-1;
  var offX=tx+dir*gr.width*0.55, offY=ty-gr.height*0.5;
  ui.ballInner.style.animation="gkSpin 250ms linear infinite";
  setTimeout(function(){ ui.ball.style.transition="transform 340ms cubic-bezier(.2,.8,.4,1), opacity 340ms"; ui.ball.style.transform="translate(-50%,-50%) translate("+offX+"px,"+offY+"px)"; ui.ball.style.opacity="0"; },80);
}
function catchEffect(t){
  flashCell(t,C.save); ui.ballInner.style.animation="none";
  ui.ballInner.style.transition="transform 110ms ease-out"; ui.ballInner.style.transform="scale(0.8)";
  setTimeout(function(){ if(ui.ballInner) ui.ballInner.style.transform="scale(1)"; },150);
  ui.keeperInner.style.transition="transform 140ms ease-out"; ui.keeperInner.style.transform="scale(1.26)";
  setTimeout(function(){ if(ui.keeperInner) ui.keeperInner.style.transform="scale(1.1)"; },260);
}
function goalBurst(z,color){
  flashCell(z,color);
  ui.ballInner.style.transition="transform 120ms ease-out"; ui.ballInner.style.transform="scale(1.25)";
  setTimeout(function(){ if(ui.ballInner) ui.ballInner.style.transform="scale(1)"; },160);
  if(ui.frame){ ui.frame.style.animation="gkShake 260ms ease-in-out"; setTimeout(function(){ if(ui.frame) ui.frame.style.animation="none"; },300); }
}

/* ---------- 途中経過 ○×○ ---------- */
function marksRow(label, color, arr, invert){
  var row=h("div","display:flex;align-items:center;gap:8px;justify-content:center;margin-top:3px");
  if(label!=null) row.appendChild(h("span","font-size:11px;font-weight:700;color:"+color+";width:70px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap",label));
  var marks=h("div","display:flex;gap:3px"); var total=Math.max(ROUNDS, arr.length);
  for(var i=0;i<total;i++){
    var ch, col;
    if(i<arr.length){ var ok=invert?!arr[i]:arr[i]; ch=ok?"○":"×"; col=ok?C.save:C.goal; }
    else { ch="・"; col=C.sub; }
    marks.appendChild(h("span","display:inline-block;width:20px;text-align:center;line-height:20px;font-size:16px;font-weight:800;color:"+col,ch));
  }
  row.appendChild(marks); return row;
}
function marksBar(){
  var box=h("div","margin:4px 0 6px");
  if(S.mode==="vs"){
    box.appendChild(marksRow(S.youTeam.name, S.youTeam.color, S.youMarks, false));
    box.appendChild(marksRow(S.oppTeam.name, S.oppTeam.color, S.oppMarks, false));
  } else if(S.mode==="kick"){
    box.appendChild(marksRow("あなた", C.ball, S.youMarks, false));
  } else {
    box.appendChild(marksRow(S.oppTeam.name, S.oppTeam.color, S.oppMarks, false));
  }
  return box;
}

/* ---------- ラウンド進行 ---------- */
function beginRound(r){ clearTimers(); S.round=r; if(S.mode==="keep") enterDefend(); else enterAttack(); }
function enterAttack(){ S.turn="attack"; if(S.intro){ var you=myKicker(); playerIntro(you, "第"+S.round+"キッカー（あなた）", kickerTags(you), [kickerMiniEls(you)], S.youTeam.color, renderAttack); } else renderAttack(); }
function enterDefend(){ if(S.intro){ var k=oppKicker(); playerIntro(k, "第"+S.round+"キッカー（相手）", kickerTags(k), marksWarnEls(k), S.oppTeam.color, startDefend); } else startDefend(); }
function kickerMiniEls(k){ var mb=h("div","max-width:300px;margin:0 auto"); var row=h("div","display:flex;gap:12px"); row.appendChild(miniBar("だまし",k.だまし,C.goal)); row.appendChild(miniBar("キック力",k.キック力,C.ball)); mb.appendChild(row); return mb; }
function marksWarnEls(k){
  var gk=S.youTeam.gk, extra=Math.floor(k.だまし/33); if(gk.メンタル>=75&&extra>0) extra--; var marks=1+extra;
  var arr=[kickerMiniEls(k)];
  if(marks>=2) arr.push(h("div","font-size:14px;font-weight:800;color:"+C.goal+";background:rgba(255,90,95,0.12);border:1px solid "+C.goal+"66;border-radius:10px;padding:8px 12px;margin:8px auto 0;max-width:320px","⚠ まとが "+marks+"つ に散らばる！"));
  if(k.キック力>=85) arr.push(h("div","font-size:13px;font-weight:700;color:"+C.ball+";margin-top:6px","💥 超強烈なキック力！"));
  return arr;
}
function playerIntro(m, roleLabel, tags, extraEls, accent, onGo){
  clearTimers(); app.innerHTML="";
  app.appendChild(navBar(null));
  var wrap=h("div","text-align:center;animation:gkIn 300ms ease-out");
  wrap.appendChild(scoreboard()); wrap.appendChild(marksBar());
  wrap.appendChild(h("div","color:"+C.sub+";font-size:12px;letter-spacing:3px;margin:6px 0 2px", roleLabel));
  var av=h("div","width:128px;height:128px;margin:6px auto 6px"); av.innerHTML=avatarSVG(m.name,m.color); wrap.appendChild(av);
  wrap.appendChild(h("div","font-size:21px;font-weight:900;color:"+C.ink,m.name));
  wrap.appendChild(h("div","font-size:15px;color:"+C.gold+";letter-spacing:2px;margin-top:2px",stars(m.star)));
  var tg=h("div","display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0");
  tags.forEach(function(t){ tg.appendChild(h("span","font-size:12px;font-weight:700;color:"+accent+";border:1px solid "+accent+";border-radius:999px;padding:4px 12px",t)); });
  wrap.appendChild(tg);
  (extraEls||[]).forEach(function(e){ wrap.appendChild(e); });
  wrap.appendChild(h("div","height:10px"));
  wrap.appendChild(bigButton("GO！", accent, onGo));
  app.appendChild(wrap);
}

/* ===== 攻撃（あなたが蹴る）===== */
function renderAttack(){
  clearTimers(); app.innerHTML=""; ui={};
  var opp=S.oppTeam.gk, you=myKicker();
  app.appendChild(navBar(null));
  app.appendChild(scoreboard());
  app.appendChild(marksBar());
  app.appendChild(h("div","text-align:center;font-size:15px;font-weight:800;color:"+S.youTeam.color+";margin:2px 0 2px","▶ あなたのキック（"+S.round+"人目）"));
  var info=h("div","display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2px");
  info.appendChild(avatarBox(you.name, you.color, 26));
  info.appendChild(h("span","font-size:13px;font-weight:700;color:"+C.ink,you.name));
  info.appendChild(h("span","font-size:11px;color:"+C.gold,stars(you.star)));
  app.appendChild(info);
  app.appendChild(h("div","text-align:center;font-size:11px;color:"+C.sub+";margin-bottom:2px","相手GK "+opp.name+"（守備範囲"+opp.守備範囲+"／反応"+opp.反応+"）"));
  var pitch=buildPitch(opp.color); app.appendChild(pitch);
  var status=h("div","min-height:92px;margin-top:10px"); ui.status=status; app.appendChild(status);
  S.shot=null; S.ao=null;
  ui.onCell=shootAt;
  requestAnimationFrame(placeKeeperRest);
  attackStatusReady(you);
}
function attackStatusReady(you){
  var s=ui.status; s.innerHTML="";
  s.appendChild(h("p","text-align:center;color:"+C.sub+";font-size:13px;margin:0 0 6px;line-height:1.6","狙うコースをタップ！　相手GKがフォームを読んで跳ぶ。"));
  var mb=h("div","max-width:300px;margin:0 auto");
  var row=h("div","display:flex;gap:12px"); row.appendChild(miniBar("だまし",you.だまし,C.goal)); row.appendChild(miniBar("キック力",you.キック力,C.ball)); mb.appendChild(row);
  s.appendChild(mb);
}
function shootAt(z){
  if(S.shot!=null) return;
  S.shot=z; ui.onCell=null;
  var opp=S.oppTeam.gk, you=myKicker();
  var guess=keeperGuess(z, opp, you); S.guess=guess;
  // マーク表示＋キーパーが跳ぶ
  ui.cells[z].style.border="2px solid "+S.youTeam.color;
  diveKeeper(guess);
  ui.status.innerHTML="";
  ui.status.appendChild(h("p","text-align:center;color:"+C.ball+";font-weight:800;font-size:17px;margin-top:20px","シュート！"));
  flyBallTo(z, FLIGHT_MS, function(){
    var res=resolveSave(z, guess, opp, you, [z]);
    var goal=!res.saved; S.ao={ goal:goal, res:res };
    ui.ballInner.style.animation="none";
    if(goal){ ui.cells[z].style.background="rgba(255,210,63,0.30)"; S.youScore++; goalBurst(z, S.youTeam.color); }
    else { ui.cells[z].style.background="rgba(53,224,122,0.28)"; if(res.hold) catchEffect(z); else deflectBall(z); }
    S.youMarks.push(goal);
    attackResult();
  });
}
function attackResult(){
  var s=ui.status; s.innerHTML=""; var goal=S.ao.goal;
  s.appendChild(h("div","text-align:center;font-size:30px;font-weight:900;color:"+(goal?C.ball:C.save), goal?"ゴール！！":"とめられた…"));
  s.appendChild(h("div","text-align:center;color:"+C.sub+";font-size:12px;margin:2px 0 10px", goal?"相手GKの逆を突いた！":("相手GK："+S.ao.res.reason)));
  if(S.mode==="kick") s.appendChild(bigButton("次へ", S.youTeam.color, endRound));
  else s.appendChild(bigButton("相手のキックへ（守る）", S.youTeam.color, enterDefend));
}

/* ===== 守備（相手が蹴る）===== */
function startDefend(){
  clearTimers(); S.turn="defend"; S.phase="ready"; S.dtarget=null; S.candidates=[]; S.committed=null; S.progress=0; S.dout=null;
  renderDefend();
}
function renderDefend(){
  app.innerHTML=""; ui={};
  var gk=S.youTeam.gk, kicker=oppKicker();
  app.appendChild(navBar(null));
  app.appendChild(scoreboard());
  app.appendChild(marksBar());
  app.appendChild(h("div","text-align:center;font-size:15px;font-weight:800;color:"+S.oppTeam.color+";margin:2px 0 2px","▶ 相手のキック（"+S.round+"人目・守る）"));
  // 相手キッカー情報
  var info=h("div","display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:2px");
  info.appendChild(avatarBox(kicker.name, kicker.color, 26));
  info.appendChild(h("span","font-size:13px;font-weight:700;color:"+C.ink,kicker.name));
  info.appendChild(h("span","font-size:11px;color:"+C.gold,stars(kicker.star)));
  app.appendChild(info);
  var pitch=buildPitch(gk.color); app.appendChild(pitch);
  var status=h("div","min-height:92px;margin-top:10px"); ui.status=status; app.appendChild(status);
  ui.onCell=commit;
  requestAnimationFrame(placeKeeperRest);
  defendStatus();
}
function defendStatus(){
  var s=ui.status; s.innerHTML=""; var gk=S.youTeam.gk;
  if(S.phase==="ready"){
    var extra=Math.floor(oppKicker().だまし/33); if(gk.メンタル>=75&&extra>0) extra--; var marks=1+extra;
    var p=h("p","color:"+C.sub+";font-size:13px;text-align:center;margin:0 0 8px;line-height:1.6");
    p.innerHTML='助走で<span style="color:'+C.ball+'">読みの光</span>が出る。'+(marks>=2?('<span style="color:'+C.goal+'">まとが'+marks+'つ</span>に散らばる！'):'')+'<br>本命だと思うマスをタップ（蹴る直前でロック）。';
    s.appendChild(p);
    s.appendChild(bigButton("受けて立つ", gk.color, startKick));
  } else if(S.phase==="runup"||S.phase==="strike"){
    s.appendChild(h("p","text-align:center;color:"+C.ball+";font-weight:800;font-size:17px;margin-top:20px", S.committed==null?"→ フォームを読んでタップ！":"跳んだ！"));
  } else if(S.phase==="resolved"&&S.dout){
    var o=S.dout, conceded=!o.saved;
    s.appendChild(h("div","text-align:center;font-size:30px;font-weight:900;color:"+(o.saved?C.save:C.goal), o.saved?"セーブ！":"きめられた…"));
    var tag=(o.stat==="だまし"&&!o.saved)?"【だまし】":"";
    s.appendChild(h("div","color:"+C.ink+";font-size:14px;margin:2px 0 4px;text-align:center", tag+o.reason));
    s.appendChild(h("div","color:"+C.sub+";font-size:12px;margin-bottom:10px;text-align:center","効いた能力："+o.stat));
    s.appendChild(bigButton("次へ", S.youTeam.color, endRound));
  }
}
function startKick(){
  if(S.phase!=="ready") return;
  var gk=S.youTeam.gk, kicker=oppKicker();
  var t=Math.floor(Math.random()*ZONES);
  var extra=Math.floor(kicker.だまし/33); if(gk.メンタル>=75&&extra>0) extra--;
  var cands=pickCandidates(t, extra); S.dtarget=t; S.candidates=cands;
  S.committed=null; S.dout=null; S.progress=0; S.phase="runup"; defendStatus();
  ui.runner.style.opacity="1"; ui.staticBall.style.display="block";
  var avgc=0; cands.forEach(function(z){ avgc+=cr(z).c; }); avgc/=cands.length;
  var fromLeft=avgc>=1.5, startX=fromLeft?22:78, emphasis=gk.反応/100*0.55;
  var t0=performance.now();
  function loop(now){
    var p=Math.min(1,(now-t0)/RUNUP_MS); S.progress=p;
    for(var z=0;z<ZONES;z++){ if(S.committed===z) continue;
      var a=0; for(var ci=0;ci<cands.length;ci++){ var w=(cands[ci]===t)?(1+emphasis):(1-emphasis*0.6); a=Math.max(a, glowAlpha(z,cands[ci],p,gk.反応)*w); }
      a=Math.min(0.5,a); ui.cells[z].style.background = a>0.02 ? "rgba(255,210,63,"+a+")":"rgba(255,255,255,0.05)"; }
    var runP=Math.min(1,p/0.85), kx=startX+(50-startX)*runP, pose=p>=0.82;
    ui.runner.style.left=kx+"%"; ui.runner.style.transform="translateX(-50%) rotate("+(pose?(fromLeft?14:-14):0)+"deg)";
    if(p<1) raf=requestAnimationFrame(loop); else defendStrike(t);
  }
  raf=requestAnimationFrame(loop);
}
function commit(z){
  if(S.phase!=="runup"||S.progress>=LOCK) return;
  if(S.committed!=null) ui.cells[S.committed].style.border="1px solid rgba(255,255,255,0.12)";
  S.committed=z; ui.cells[z].style.border="2px solid "+S.youTeam.gk.color; diveKeeper(z); defendStatus();
}
function defendStrike(t){
  S.phase="strike"; defendStatus(); ui.runner.style.opacity="0";
  flyBallTo(t, FLIGHT_MS, function(){
    var res=resolveSave(t, S.committed, S.youTeam.gk, oppKicker(), S.candidates);
    S.dout=res; S.phase="resolved";
    if(res.saved) S.saves++; else S.oppScore++;
    S.oppMarks.push(!res.saved);
    ui.ballInner.style.animation="none";
    ui.cells[t].style.background = res.saved ? "rgba(53,224,122,0.28)":"rgba(255,90,95,0.28)";
    if(res.saved){ if(res.hold) catchEffect(t); else deflectBall(t); } else if(res.power) powerBlast(t);
    defendStatus();
  });
}

/* ---------- ラウンド終了 → 勝敗判定 ---------- */
function endRound(){
  if(S.mode!=="vs"){
    if(S.round<ROUNDS){ beginRound(S.round+1); return; }
    renderResult(); return;
  }
  var decided = S.youScore!==S.oppScore;
  if(!S.sudden){
    if(S.round<ROUNDS){ beginRound(S.round+1); return; }
    if(decided){ renderResult(); return; }
    S.sudden=true; beginRound(S.round+1); return;   // サドンデス突入
  }
  // サドンデス：1ラウンド終わって差がついたら決着
  if(decided){ renderResult(); return; }
  beginRound(S.round+1);
}

/* ---------- 結果 ---------- */
function rating(n){ return n>=5?"パーフェクト！":n>=4?"すごい！":n>=3?"good":n>=1?"つぎがんばろう":"どんまい"; }
function renderResult(){
  clearTimers(); app.innerHTML="";
  var wrap=h("div","text-align:center;animation:gkIn 340ms ease-out");
  wrap.appendChild(h("div","color:"+C.sub+";font-size:12px;letter-spacing:3px;margin-bottom:8px","RESULT"));
  wrap.appendChild(marksBar());
  if(S.mode==="vs"){
    var win=S.youScore>S.oppScore;
    wrap.appendChild(h("div","font-size:46px;font-weight:900;margin:6px 0;color:"+(win?C.save:C.goal), win?"WIN！":"LOSE…"));
    wrap.appendChild(h("div","font-size:40px;font-weight:900;color:"+C.ink, S.youScore+" - "+S.oppScore));
    var t=h("div","display:flex;gap:10px;justify-content:center;margin:10px 0 18px;color:"+C.sub+";font-size:13px");
    t.appendChild(h("span",null,S.youTeam.name)); t.appendChild(h("span",null,"vs")); t.appendChild(h("span",null,S.oppTeam.name)); wrap.appendChild(t);
  } else {
    var n = S.mode==="kick" ? S.youScore : S.saves;
    var lab = S.mode==="kick" ? "ゴール" : "セーブ";
    var col = S.mode==="kick" ? C.ball : C.save;
    wrap.appendChild(h("div","font-size:46px;font-weight:900;margin:6px 0;color:"+col, n+" / "+ROUNDS));
    wrap.appendChild(h("div","font-size:18px;color:"+C.ink+";margin-bottom:4px",lab));
    wrap.appendChild(h("div","font-size:16px;color:"+C.sub+";margin-bottom:18px",rating(n)));
  }
  wrap.appendChild(bigButton("もう一度（モード選択へ）", S.youTeam?S.youTeam.color:"#4bc0e8", function(){ resetGame(); renderModeSelect(); }));
  app.appendChild(wrap);
}

renderModeSelect();
</script>
